<!doctype html>
<html lang="en" data-mode="dark">
<head>
<meta charset="utf-8">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reader — __TITLE__</title>
<link rel="stylesheet" href="/reader.css">
</head>
<body data-token="__TOKEN__" data-url="__URL__">
<header id="bar">
  <div id="bar-left">
    <span id="brand">Reader</span>
    <span id="doc-title" title="__URL__">__TITLE__</span>
  </div>
  <div id="bar-right">
    <button id="btn-score" title="AI score this paragraph (←; when the article wheel is focused, ← returns to the paragraph; double ← removes AI-written ones)">◀ AI score</button>
    <button id="btn-fact" title="Fact-check this paragraph against other news outlets (→, press again to focus the wheel, double → for the whole article)">Fact-check ▶</button>
    <button id="btn-undo" hidden title="Restore the removed AI-written paragraphs">Undo</button>
    <button id="btn-prev" title="Previous paragraph (↑). On the first paragraph this summarises the whole article; Ctrl+↑ summarises the paragraph.">↑</button>
    <button id="btn-next" title="Next paragraph (j)">↓</button>
    <button id="btn-fontdec" title="Smaller text">A−</button>
    <button id="btn-fontinc" title="Larger text">A+</button>
    <button id="btn-summary" title="AI summary of the article (s)">Summarize</button>
    <button id="btn-markall" title="Mark possibly AI-written paragraphs (M)">Mark AI text</button>
    <button id="btn-focus" title="Paragraph focus (f) — move with j/k or ↑/↓">Focus</button>
    <a id="btn-original" href="__URL__" title="Open the original page">Original</a>
    <button id="btn-hide" title="Toggle chrome">Aa</button>
  </div>
</header>

<div id="status" role="status" aria-live="polite"></div>

<!-- The AI summary is rendered *into* #article as its first block (above the
     title) so it takes part in paragraph focus and can be reached with ↑. -->

<main id="article" tabindex="-1"></main>

<footer id="hint">
  <span><kbd>f</kbd> focus</span>
  <span><kbd>j</kbd>/<kbd>k</kbd> paragraphs</span>
  <span><kbd>←</kbd> AI score · <kbd>←←</kbd> remove AI · <kbd>←</kbd> back from wheel</span>
  <span><kbd>→</kbd> fact-check · <kbd>→→</kbd> whole article</span>
  <span><kbd>↑</kbd> back · <kbd>↑</kbd> on first para = whole-article summary · <kbd>Ctrl+↑</kbd> paragraph summary</span>
  <span><kbd>Enter</kbd> open article</span>
  <span><kbd>m</kbd> mark</span>
  <span><kbd>M</kbd> mark all</span>
  <span><kbd>s</kbd> summary</span>
</footer>

<script>window.__READER_COLORS__ = __COLORS__;</script>
<script>window.__READER_ARTICLE__ = __ARTICLE_JSON__;</script>
<script src="/readability.js"></script>
<script src="/reader.js"></script>
</body>
</html>

name: tests

# Policy as code runs here too, but as part of the full suite: every test kind the
# plugin promises (unit, regression, integration, js, shell) plus mutation testing.
on:
  push:
  pull_request:

jobs:
  suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # the policy check diffs against the base branch
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # PyNaCl is a real RUNTIME dependency of the KeePassXC fill userscript (it speaks the
      # browser protocol with nacl). Without it, tests/test_integration_keepassxc_socket.py
      # skips silently — and the fill target's mutation score collapses from 0.50 to 0.18,
      # because that socket coverage never runs. Installing it is what makes the CI
      # mutation number mean anything.
      - name: Install the plugin's runtime dependency (PyNaCl)
        run: python3 -m pip install --quiet pynacl
      # reader/reader.js is a browser script: the only honest way to test it is in a
      # browser engine. tests/js/qt_harness.py drives the real reader page in an offscreen
      # QtWebEngine view and tests/js/reader.harness.test.js asserts on what it observes.
      # Without PyQt6 those assertions skip and reader.js's mutation score collapses
      # from 0.30 to 0.02 — the same trap as the missing PyNaCl. The harness uses
      # /usr/bin/python3, so the distribution package is what matters, not setup-python's.
      - name: Install QtWebEngine (for the reader.js browser harness)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pyqt6 python3-pyqt6.qtwebengine

      - name: All test kinds (policy, unit, regression, integration, js, shell, mutation)
        run: bash tools/run_tests.sh
        env:
          PYTHONDONTWRITEBYTECODE: "1"
